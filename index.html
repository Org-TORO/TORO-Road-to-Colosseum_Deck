<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Toro's Journey</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;700;800&family=Dancing+Script:wght@600;700&family=Playfair+Display:ital,wght@0,700;0,800;1,700&family=Nunito:ital,wght@0,400;0,600;0,700;0,800;1,400&display=swap" rel="stylesheet">
<style>
:root{
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
  --bg:#e6f0f8;
  --paper:#f7fbfe;
  --paper-2:#e4f0f8;
  --ink:#1f3d5e;
  --ink-soft:#5b7ea3;
  --route:#e0664f;
  --gold:#3f78a8;
  --sea:#d6ebf6;
  --land:#d8bb80;
  --hud-bg:#ffffff;
  --display:'Baloo 2','Trebuchet MS',system-ui,sans-serif;
  --body:'Nunito','Segoe UI',system-ui,sans-serif;
  --map-img:url(assets/img-00.jpg);
  --cover-img:url(assets/img-01.jpg);
  --map-font:'Playfair Display',Georgia,serif;
  --script:'Dancing Script','Brush Script MT',cursive;
  --sea-img:url(assets/img-02.jpg);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){ --bg:#132a41; }
}
:root[data-theme="dark"]{ --bg:#132a41; }
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
html,body{height:100%;margin:0}
body{background:var(--sea-img) center/cover no-repeat,var(--bg);color:var(--ink);font-family:var(--body);overflow:hidden;-webkit-font-smoothing:antialiased}

#viewport{position:fixed;inset:0;overflow:hidden}
#world{background:var(--map-img) center/100% 100% no-repeat,#ecd9ad;border-radius:4px;box-shadow:0 26px 70px -24px rgba(31,61,94,.55),0 2px 6px rgba(60,40,20,.25);position:absolute;left:0;top:0;width:1600px;height:1171px;transform-origin:0 0;
  transition:transform 1.5s cubic-bezier(.66,0,.24,1);will-change:transform}
#world.instant{transition:none}
#map{display:block;width:1600px;height:1171px;overflow:visible}

.isl{cursor:pointer}
.isl:focus{outline:none}
.isl:focus-visible .land{stroke:var(--route);stroke-width:4}
.lbl{font-family:var(--map-font);font-style:italic;font-weight:800;font-size:36px;fill:#3b2716;paint-order:stroke;stroke:#f7ebcb;stroke-width:7px;stroke-linejoin:round}
.rlbl{font-family:var(--script);font-weight:700;fill:#4a3220}
.slbl{font-family:var(--script);font-weight:600;fill:#1d5c63;fill-opacity:.6}
.badge-t{font-family:var(--map-font);font-weight:800;font-size:30px;fill:#ffffff}
#ship{cursor:pointer;filter:drop-shadow(0 0 2.5px #fffdf2) drop-shadow(0 0 1px #fffdf2) drop-shadow(0 5px 6px rgba(40,25,10,.35))}
#dockMsg{border-radius:12px;position:fixed;top:calc(16px + env(safe-area-inset-top,0px));left:50%;transform:translate(-50%,-12px);z-index:7;
  background:rgba(59,39,22,.9);color:#fff6e0;font-size:16px;padding:10px 16px;opacity:0;pointer-events:none;transition:opacity .4s,transform .4s;max-width:calc(100vw - 24px);text-align:center}
#dockMsg.show{opacity:1;transform:translate(-50%,0)}
#dockMsg b{color:#ffd66b}
#ship .bob{animation:bob 2.6s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
@keyframes bob{0%,100%{transform:translateY(0) rotate(-2deg)}50%{transform:translateY(-3px) rotate(2deg)}}
#xmark{opacity:0;transition:opacity .8s}
.found #xmark{opacity:1;animation:pulse 1.8s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
@keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.08)}}
.isl .ring{stroke-opacity:.95;animation:dash 7s linear infinite;transition:stroke-width .25s}
@keyframes dash{to{stroke-dashoffset:-72}}
.isl:hover .ring,.isl:focus-visible .ring{stroke-width:7}
.isl.here .ring{stroke:#f2c14e;stroke-width:7}
.isl.here .halo{opacity:1}
.isl .halo{opacity:.9;transition:opacity .4s}
#routeBase path.next{stroke:#d9901f;animation:flow 1s linear infinite}
@keyframes flow{to{stroke-dashoffset:-48}}

.isl:hover .pill{fill:#fff6de}
.pill{fill:#fbf1d6;stroke:#6b2d12;stroke-width:3;filter:drop-shadow(0 3px 3px rgba(40,20,5,.35))}

.cart-a,.cart-b{transition:opacity .8s}
.cart-b{opacity:0}
.found .cart-a{opacity:0}
.found .cart-b{opacity:1}

/* Page */
#page{position:fixed;inset:0;z-index:5;overflow:auto;color:var(--ink);
  background:linear-gradient(rgba(247,251,254,.5),rgba(247,251,254,.68)),var(--sea-img) center/cover no-repeat;
  padding:calc(34px + env(safe-area-inset-top,0px)) clamp(22px,6vw,110px) calc(120px + env(safe-area-inset-bottom,0px));
  clip-path:circle(0% at 50% 50%);visibility:hidden;
  transition:clip-path .7s cubic-bezier(.6,0,.2,1),visibility 0s linear .7s}
#page.open{clip-path:circle(150% at 50% 50%);visibility:visible;transition:clip-path .85s cubic-bezier(.6,0,.2,1),visibility 0s}
#page::before{content:"";position:fixed;inset:14px;border:2px solid rgba(31,61,94,.25);border-radius:22px;pointer-events:none}
.wm{position:fixed;right:clamp(24px,5vw,80px);bottom:70px;font-family:var(--display);font-size:clamp(160px,24vw,360px);line-height:1;color:rgba(31,61,94,.07);pointer-events:none}
.pbar,.pwrap,.tools{max-width:1100px;margin-left:auto;margin-right:auto;position:relative}
.pbar{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
.k{font-style:italic;color:var(--gold);font-size:clamp(16px,1.3vw,21px);margin:0}
.pact{display:flex;gap:8px}
.tools{position:sticky;top:0;z-index:2;display:flex;gap:6px;flex-wrap:wrap;padding:12px 0;margin-top:10px}
.tools[hidden]{display:none}
.tools .hb{height:38px;font-size:15px}
.ptitle{font-family:var(--display);font-weight:800;letter-spacing:-.01em;font-size:clamp(48px,6.5vw,112px);line-height:1;margin:.35em 0 .4em;color:var(--ink)}
.pbody{font-size:clamp(19px,1.6vw,27px);line-height:1.55;max-width:44em}
.pbody h3{font-weight:700;font-size:1.12em;margin:1.1em 0 .3em}
.pbody p{margin:0 0 .8em}
.pbody ul,.pbody ol{margin:0 0 .9em;padding-left:1.3em}
.pbody li{margin-bottom:.25em}
.pbody li::marker{color:var(--route)}
.pbody ol li::marker{font-family:var(--display)}
.pbody blockquote{margin:0 0 .9em;padding-left:.9em;border-left:3px solid var(--route);font-style:italic}
[contenteditable="true"]{outline:2px dashed rgba(168,50,31,.55);outline-offset:10px;cursor:text}
.pbody[contenteditable="true"]{min-height:40vh}
.ptitle:empty::before{content:"Tiêu đề chặng";opacity:.35}
#saveState{font-style:italic;color:var(--ink-soft);font-size:16px;margin:28px 0 0;min-height:1.3em}
.hb.primary{background:var(--route);color:#ffffff;border-color:var(--route)}
.hb.primary:hover{background:#c9533d}


/* Intro */
#intro{position:fixed;inset:0;z-index:30;display:flex;align-items:center;justify-content:center;cursor:pointer;overflow:hidden;
  background:var(--cover-img) center/cover no-repeat,#eaf3fb;transition:opacity .6s ease}
#intro::after{content:"";position:absolute;inset:0;background:radial-gradient(ellipse at 50% 50%,rgba(10,25,45,.35),rgba(10,25,45,.7));opacity:0;transition:opacity .9s ease;z-index:1;pointer-events:none}
#intro.opening::after{opacity:1}
#intro.expand::after{opacity:0}
#intro.gone{opacity:0;pointer-events:none}
.i-title{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);margin:0}
.i-sub{position:absolute;z-index:3;margin:0;display:flex;flex-direction:column;gap:2px;padding:12px 20px 12px 18px;border-radius:16px;
  background:rgba(255,255,255,.9);border:2px solid #1f3d5e;box-shadow:0 12px 30px -12px rgba(15,35,60,.55);
  font-family:var(--body);color:#1f3d5e;transform:translateY(-50%);transition:opacity .4s,transform .4s;white-space:nowrap}
.i-sub b{font-family:var(--map-font);font-style:italic;font-weight:800;font-size:clamp(17px,1.55vw,24px);color:#16365a}
.i-sub span{font-size:clamp(13px,1.05vw,16px);color:#3f78a8;font-weight:700;display:flex;align-items:center;gap:6px}
.i-sub span::before{content:"";width:9px;height:9px;border-radius:50%;background:#e0664f;box-shadow:0 0 0 0 rgba(224,102,79,.6);animation:ping 1.6s infinite}
.i-sub::before{content:"";position:absolute;right:-11px;top:50%;width:18px;height:18px;background:rgba(255,255,255,.95);border-right:2px solid #1f3d5e;border-top:2px solid #1f3d5e;transform:translateY(-50%) rotate(45deg)}
.i-sub{animation:bubble 2.6s ease-in-out infinite}
@keyframes bubble{50%{margin-top:-5px}}
@keyframes ping{70%{box-shadow:0 0 0 9px rgba(224,102,79,0)}100%{box-shadow:0 0 0 0 rgba(224,102,79,0)}}
#intro.opening .i-sub{opacity:0;transform:translateY(-50%) translateX(12px)}
.scroll{position:relative;z-index:2;width:min(80vw,calc(62vh*1.366));aspect-ratio:1600/1171;transform-origin:50% 50%;opacity:0}
.scroll-glow{position:absolute;left:50%;top:50%;width:46%;height:120%;transform:translate(-50%,-50%);border-radius:50%;
  background:radial-gradient(ellipse,rgba(255,230,150,.75),rgba(255,230,150,0) 65%);animation:glow 2.4s ease-in-out infinite;pointer-events:none;transition:opacity .5s}
@keyframes glow{50%{opacity:.45;transform:translate(-50%,-50%) scale(.92)}}
#intro.opening .scroll-glow{opacity:0}
.scroll-bob{position:absolute;inset:0;animation:bob2 3s ease-in-out infinite}
@keyframes bob2{50%{transform:translateY(-6px) rotate(-.6deg)}}
#intro.opening .scroll-bob{animation:none}
.paper{position:absolute;inset:0;background:var(--map-img) center/100% 100% no-repeat;clip-path:inset(0 50% 0 50%);
  filter:drop-shadow(0 18px 30px rgba(10,25,45,.45))}
/* rolled parchment cylinders with turned wooden finials */
.roll{position:absolute;top:-6%;bottom:-6%;width:8.5%;left:50%;border-radius:22px/14px;
  background:
    repeating-linear-gradient(180deg,rgba(120,85,40,.0) 0 22px,rgba(120,85,40,.13) 22px 24px),
    linear-gradient(90deg,#9c7a48 0%,#d9bd86 12%,#f7e8c4 30%,#fff6dc 40%,#ead39f 62%,#c19b5f 84%,#8c6634 100%);
  box-shadow:0 14px 28px rgba(10,25,45,.45),inset 0 0 0 1.5px rgba(90,58,30,.45)}
.roll::before,.roll::after{content:"";position:absolute;left:50%;width:150%;height:6.5%;transform:translateX(-50%);border-radius:50%;
  background:radial-gradient(ellipse at 50% 35%,#ffe7a3 0%,#e3b553 30%,#a8761f 65%,#6b4710 100%);
  box-shadow:0 4px 8px rgba(0,0,0,.35),inset 0 -3px 0 rgba(0,0,0,.18)}
.roll::before{top:-3.5%}.roll::after{bottom:-3.5%}
.roll i{position:absolute;left:50%;width:62%;height:2.2%;transform:translateX(-50%);border-radius:50%;background:#5a3a1e;opacity:.55}
.roll i:first-child{top:2.4%}.roll i:last-child{bottom:2.4%}
.roll.l{transform:translateX(-100%)}
.roll.r{transform:translateX(0)}
.band{position:absolute;left:50%;top:50%;width:24%;height:9%;transform:translate(-50%,-50%);
  background:linear-gradient(180deg,#c8402e,#9e2a1c 55%,#7d1e13);border-radius:3px;box-shadow:0 6px 12px rgba(0,0,0,.4);transition:opacity .35s,transform .45s}
.band::before,.band::after{content:"";position:absolute;top:80%;width:22%;height:150%;background:linear-gradient(180deg,#b8382a,#8a2416);
  clip-path:polygon(0 0,100% 0,100% 100%,50% 82%,0 100%)}
.band::before{left:30%;transform:rotate(14deg)}.band::after{right:30%;transform:rotate(-14deg)}
.seal{position:absolute;left:50%;top:50%;width:clamp(64px,8vw,112px);aspect-ratio:1;transform:translate(-50%,-50%);
  border-radius:47% 53% 50% 50%/52% 48% 52% 48%;
  background:radial-gradient(circle at 36% 30%,#ef6a59,#b72c1e 55%,#7a160c);
  box-shadow:0 8px 16px rgba(0,0,0,.45),inset 0 0 0 6px rgba(0,0,0,.14),inset 0 0 0 9px rgba(255,190,170,.18);
  display:grid;place-items:center;transition:opacity .35s,transform .45s}
.seal svg{width:56%;height:56%}
#intro.opening .seal{opacity:0;transform:translate(-50%,-50%) scale(1.7) rotate(30deg)}
#intro.opening .band{opacity:0;transform:translate(-50%,-50%) scaleX(1.9)}
.curl{position:absolute;top:0;bottom:0;width:7%;left:50%;pointer-events:none;transition:opacity .6s}
.curl.l{transform:translateX(0);background:linear-gradient(90deg,rgba(60,35,10,.5),rgba(60,35,10,0))}
.curl.r{transform:translateX(-100%);background:linear-gradient(270deg,rgba(60,35,10,.5),rgba(60,35,10,0))}
#intro.expand .curl,#intro.expand .roll{opacity:0}

.hb{border-radius:12px;font:700 15px var(--body);color:var(--ink);background:var(--hud-bg);border:1.5px solid var(--ink);height:42px;min-width:42px;
  padding:0 14px;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:6px;box-shadow:0 6px 16px -8px rgba(0,0,0,.5)}
.hb:hover{background:#eef6fc}
.hb:focus-visible{outline:3px solid var(--route);outline-offset:2px}
.pbar{z-index:3}
.pcount{font-family:var(--body);font-weight:700;color:var(--ink-soft);font-size:15px;align-self:center;margin-right:4px}
.slide-img{position:fixed;inset:0;z-index:2;display:none;align-items:center;justify-content:center;cursor:pointer;
  padding:calc(78px + env(safe-area-inset-top,0px)) 2vw calc(18px + env(safe-area-inset-bottom,0px))}
.slide-img img{max-width:100%;max-height:100%;object-fit:contain;border-radius:12px;box-shadow:0 24px 60px -20px rgba(20,30,50,.55);animation:slideIn .5s ease}
@keyframes slideIn{from{opacity:0;transform:scale(.98)}to{opacity:1;transform:none}}
#page.img-mode .slide-img{display:flex}
#page.img-mode .pwrap,#page.img-mode .tools,#page.img-mode .wm{display:none}
body.img-slide #helmWrap,body.flipping #helmWrap{opacity:0;pointer-events:none}
#page.full-mode .slide-img{padding:0}
[hidden]{display:none!important}
.slide-img .bgfill{display:none}
#page.full-mode.contain-mode .slide-img{overflow:hidden}
#page.full-mode.contain-mode .slide-img .bgfill,.leaf.contain .slide-img .bgfill{display:block;position:absolute;inset:-60px;width:calc(100% + 120px);height:calc(100% + 120px);max-width:none;max-height:none;object-fit:cover;filter:none;animation:none;opacity:.85}
#page.full-mode.contain-mode .slide-img #slideImgEl,.leaf.full.contain .slide-img img.main{position:relative;object-fit:contain;object-position:center}
#page.full-mode .slide-img img{object-position:50% 32%;width:100%;height:100%;max-width:none;max-height:none;object-fit:cover;border-radius:0;box-shadow:none}
#page.full-mode .pbar{opacity:0;pointer-events:none}
#page.full-mode::before{display:none}
.flip-wrap{position:fixed;inset:0;z-index:40;pointer-events:none;overflow:hidden}
.leaf{position:absolute;inset:0;transform-origin:left center;will-change:transform}
.leaf .face{position:absolute;inset:0;overflow:hidden}
.leaf .back{display:none}
.leaf.show-back .front{display:none}
.leaf.show-back .back{display:block}
.leaf .front{background:linear-gradient(rgba(247,251,254,.5),rgba(247,251,254,.68)),var(--sea-img) center/cover no-repeat,#f7fbfe;box-shadow:0 0 50px rgba(0,0,0,.35)}
.leaf .back{background:
  linear-gradient(270deg,rgba(90,60,25,.35),rgba(90,60,25,0) 22%),
  repeating-linear-gradient(0deg,rgba(120,90,50,.06) 0 2px,transparent 2px 28px),
  radial-gradient(ellipse at 40% 50%,#f6ead0,#e8d3a6);box-shadow:0 0 50px rgba(0,0,0,.35)}
.leaf .slide-img{display:flex;position:absolute;inset:0}
.leaf.full .slide-img{padding:0}
.leaf.full .slide-img img.main{object-position:50% 32%;width:100%;height:100%;max-width:none;max-height:none;object-fit:cover;border-radius:0;box-shadow:none;animation:none}
.leaf .slide-img img{animation:none}
.leaf .gloss{position:absolute;inset:0;pointer-events:none;background:linear-gradient(90deg,rgba(0,0,0,0) 30%,rgba(0,0,0,.45));opacity:0}
.flip-shade{position:absolute;inset:0;background:linear-gradient(90deg,rgba(0,0,0,.4),rgba(0,0,0,.1));pointer-events:none}
#flipNext{position:fixed;z-index:6;right:calc(14px + env(safe-area-inset-right,0px));bottom:calc(70px + env(safe-area-inset-bottom,0px));width:56px;height:56px;border-radius:50%;
  background:rgba(251,241,214,.92);border:2.5px solid #6b2d12;color:#6b2d12;font:800 30px/1 var(--map-font);cursor:pointer;box-shadow:0 8px 20px -6px rgba(0,0,0,.5);transition:transform .2s,background .2s}
#flipNext:hover{transform:scale(1.08);background:#fff6de}
#flipNext:focus-visible{outline:3px solid #e0664f;outline-offset:3px}
#helmWrap{transition:transform .5s ease,opacity .4s}

/* book spread flip (image -> image) */
.rnd{position:absolute;inset:0;overflow:hidden;background:linear-gradient(rgba(247,251,254,.5),rgba(247,251,254,.68)),var(--sea-img) center/cover no-repeat,#f7fbfe}
.rnd{isolation:isolate}
.rnd .slide-img{display:flex;position:absolute;inset:0;z-index:auto}
.rnd .slide-img img{animation:none}
.rnd.full .slide-img{padding:0}
.rnd.full .slide-img img.main{object-position:50% 32%;width:100%;height:100%;max-width:none;max-height:none;object-fit:cover;border-radius:0;box-shadow:none}
.rnd.contain .slide-img .bgfill{display:block;position:absolute;inset:-60px;width:calc(100% + 120px);height:calc(100% + 120px);max-width:none;max-height:none;object-fit:cover;filter:none;opacity:.85}
.rnd.full.contain .slide-img img.main{position:relative;object-fit:contain;object-position:center}
.book-leaf{position:absolute;top:0;bottom:0;left:50%;width:50%;overflow:hidden;transform-origin:0 50%;will-change:transform;-webkit-backface-visibility:visible}
.book-leaf .fr,.book-leaf .bkwrap{position:absolute;top:0;left:0;width:100%;height:100%;overflow:visible}
.book-leaf .bkwrap{display:none;transform:scaleX(-1)}
.book-leaf.show-back .fr{display:none}
.book-leaf.show-back .bkwrap{display:block}
.book-half{position:absolute;top:0;bottom:0;width:50%;overflow:hidden}
.rnd.wide{inset:auto;top:0;height:100%;width:200%}
.book-gloss{position:absolute;inset:0;pointer-events:none;opacity:0}
.book-shadow{position:absolute;top:0;bottom:0;pointer-events:none;opacity:0}
.book-spine{position:absolute;top:0;bottom:0;left:50%;width:60px;transform:translateX(-50%);pointer-events:none;
  background:linear-gradient(90deg,rgba(0,0,0,0),rgba(0,0,0,.28) 50%,rgba(0,0,0,0));opacity:0}
.content-rnd{padding:calc(34px + env(safe-area-inset-top,0px)) clamp(22px,6vw,110px) 0}
.content-rnd::before{content:"";position:absolute;inset:14px;border:2px solid rgba(31,61,94,.25);border-radius:22px;pointer-events:none}
.content-rnd .wm{position:absolute}
.leaf .front.generic{background:none}
#page.noanim{transition:none!important}
#slideVidEl{max-width:100%;max-height:100%;border-radius:12px}
#page.full-mode .slide-img #slideVidEl{position:relative;width:100%;height:100%;max-width:none;max-height:none;border-radius:0;object-fit:cover}
#page.full-mode.contain-mode .slide-img #slideVidEl{object-fit:contain}
/* Helm HUD */
#helmWrap{position:fixed;z-index:6;left:clamp(8px,1.5vw,24px);bottom:calc(6px + env(safe-area-inset-bottom,0px));
  width:clamp(200px,21vw,310px);transform-origin:0 100%;transition:transform .5s ease}
body.page-open #helmWrap{transform:scale(.72)}
#helm{display:block;width:100%;height:auto;overflow:visible;filter:drop-shadow(0 8px 12px rgba(30,15,5,.45));touch-action:none;user-select:none;-webkit-user-select:none}
#wheel{transition:transform .9s cubic-bezier(.3,1.4,.5,1);cursor:grab}
#wheel.drag{transition:none;cursor:grabbing}
.tok{cursor:pointer}
.tok circle{fill:#f4e6c2;stroke:#5a3a1e;stroke-width:2.4;transition:fill .3s}
.tok text{font-family:var(--map-font);font-weight:800;font-size:19px;fill:#4a3220;pointer-events:none}
.tok.done circle{fill:#d9c294}
.tok.cur circle{fill:#e0664f;stroke:#7a2414}
.tok.cur text{fill:#fff}
.tok:hover circle{stroke:#e0664f;stroke-width:3.4}
.tok:focus{outline:none}
.tok:focus-visible circle{stroke:#f2c14e;stroke-width:4}
#hub:hover circle:nth-child(3){fill:#f2c14e}
#hub:focus{outline:none}
#fsBtn{position:fixed;z-index:6;right:calc(14px + env(safe-area-inset-right,0px));bottom:calc(14px + env(safe-area-inset-bottom,0px));width:44px;height:44px;border-radius:50%;
  background:#f4e6c2;border:2px solid #5a3a1e;color:#4a3220;font-size:18px;cursor:pointer;box-shadow:0 6px 14px -6px rgba(0,0,0,.5)}
#fsBtn:hover{background:#fff6de}
#fsBtn:focus-visible{outline:3px solid #e0664f;outline-offset:2px}
@media (max-width:760px){#fsBtn{display:none}}

  if(k===0){const a=docks[0],b=docks[1];d=`M${a.x},${a.y} L${b.x+.01},${b.y}`;}
  else{
    const p0=RP[Math.max(0,k-2)],p1=RP[k-1],p2=RP[k],p3=RP[Math.min(N-1,k+1)];
    const c1={x:p1.x+(p2.x-p0.x)/6,y:p1.y+(p2.y-p0.y)/6},c2={x:p2.x-(p3.x-p1.x)/6,y:p2.y-(p3.y-p1.y)/6};

  }
  el('path',{d},document.getElementById('routeHalo'));
  segs.push(el('path',{d},routeBase));
  const t=el('path',{d},routeTrail);
  const L=t.getTotalLength();t.style.strokeDasharray=L;t.style.strokeDashoffset=L;t._L=L;trails.push(t);

function setShip(x,y,f){shipPos={x,y};if(f)flip=f;ship.setAttribute('transform',`translate(${x.toFixed(1)},${y.toFixed(1)}) scale(${flip*.85},.85)`);}
const ease=t=>t<.5?2*t*t:1-Math.pow(-2*t+2,2)/2;

function animate(dur,fn){
  return new Promise(res=>{
    if(reduce||dur<=0){fn(1);res();return;}
    const t0=performance.now();
    (function step(now){const t=Math.min(1,(now-t0)/dur);fn(ease(t));t<1?requestAnimationFrame(step):res();})(t0);
  });
}
function sailSeg(k,forward){
  const p=segs[k],L=p.getTotalLength(),tr=trails[k];
  return animate(1800,e=>{
    const s=forward?L*e:L*(1-e);
    const pt=p.getPointAtLength(s),pt2=p.getPointAtLength(Math.min(L,Math.max(0,s+(forward?1:-1))));
    const dx=pt2.x-pt.x;setShip(pt.x,pt.y,Math.abs(dx)>.05?(dx<0?-1:1):flip);
    tr.style.strokeDashoffset=L-s;
  });
}
function setTrails(upto){trails.forEach((t,k)=>t.style.strokeDashoffset=k<=upto?0:t._L);}
function sailStraight(target){
  const a={...shipPos},b=docks[target+1];
  setShip(a.x,a.y,b.x<a.x?-1:1);
  return animate(1800,e=>setShip(a.x+(b.x-a.x)*e,a.y+(b.y-a.y)*e)).then(()=>setTrails(target));
}

function fit(){const W=innerWidth,H=innerHeight;const f=Math.max(W/1600,H/1171);return{f,W,H};}
function camOverview(){const{f,W,H}=fit();
  const cx=Math.min(0,Math.max(W-1600*f,W/2-830*f)),cy=Math.min(0,Math.max(H-1171*f,H/2-695*f));
  return{s:f,x:cx,y:cy};}
function camIsland(i){
  const{W,H}=fit(),s0=ISL[i],D=2*s0.r*1.4+90,mobile=W<=760;
  const s=Math.min(mobile?Math.min(H*.5/D,W*.85/D):Math.min(H*.7/D,W*.6/D),fit().f*2.8);
  const tx=W*.5,ty=(H-70)*.5;
  return{s,x:tx-s0.x*s,y:ty-(s0.y+s0.r*.2)*s};
}

async function goTo(i){
  let sail=Promise.resolve();
  if(i===cur+1)sail=sailSeg(i,true);
  else if(i===cur-1)sail=sailSeg(cur,false);
  else if(i!==cur)sail=sailStraight(i);
  cur=i;docked=i>=0;updateDots();
  await sail;
}
async function run(fn){if(busy)return;busy=true;hint.classList.add('gone');try{await fn();}finally{busy=false;}}

function next(){run(async()=>{
  if(zoomed){if(openIdx>=0&&slideIdx<slideCount(openIdx)-1){slideIdx++;await renderSlide(1);return;}await finishIsland();return;}
  if(docked&&cur>=0){docked=false;await zoomIn(cur);return;}
  if(cur<N-1)await goTo(cur+1);
});}
function prev(){run(async()=>{
  if(zoomed){if(openIdx>=0&&slideIdx>0){slideIdx--;await renderSlide(-1);return;}await zoomOut();return;}
  if(cur>0){docked=false;await goTo(cur-1);}
});}
function jump(i){run(async()=>{
  if(zoomed){if(i===cur)return;await zoomOut();}
  if(i===cur){docked=false;await zoomIn(i);return;}
  await goTo(i);
});}
function openHere(){run(async()=>{
  if(zoomed){await zoomOut();return;}
  if(cur>=0){docked=false;await zoomIn(cur);}
});}

const ALLOWED=new Set(['P','H3','UL','OL','LI','B','STRONG','I','EM','U','BR','BLOCKQUOTE']);
function clean(html){
  const doc=new DOMParser().parseFromString('<div>'+html+'</div>','text/html');
  const root=doc.body.firstChild;
  (function walk(node){
    [...node.childNodes].forEach(ch=>{
      if(ch.nodeType===3)return;
      if(ch.nodeType!==1){ch.remove();return;}
      if(['SCRIPT','STYLE','IFRAME','OBJECT','EMBED','SVG','IMG'].includes(ch.tagName)){ch.remove();return;}
      walk(ch);
      if(ch.tagName==='DIV'){const p=doc.createElement('p');while(ch.firstChild)p.appendChild(ch.firstChild);ch.replaceWith(p);return;}
      if(!ALLOWED.has(ch.tagName)){ch.replaceWith(...ch.childNodes);return;}
      [...ch.attributes].forEach(a=>ch.removeAttribute(a.name));
    });
  })(root);
  return root.innerHTML.slice(0,60000);
}

function leafFrom(el){
  const wrap=document.createElement('div');wrap.className='flip-wrap';
  const shade=document.createElement('div');shade.className='flip-shade';wrap.appendChild(shade);
  const leaf=document.createElement('div');leaf.className='leaf';
  const front=document.createElement('div');front.className='face front generic';front.appendChild(el);
  const back=document.createElement('div');back.className='face back';
  const gloss=document.createElement('div');gloss.className='gloss';
  leaf.append(front,back,gloss);wrap.appendChild(leaf);document.body.appendChild(wrap);return{wrap,leaf,shade,gloss};
}
function makeLeaf(sl){
  const wrap=document.createElement('div');wrap.className='flip-wrap';
  const shade=document.createElement('div');shade.className='flip-shade';wrap.appendChild(shade);
  const leaf=document.createElement('div');leaf.className='leaf'+(sl.full?' full':'')+(sl.fit==='contain'?' contain':'');
  const front=document.createElement('div');front.className='face front';
  const box=document.createElement('div');box.className='slide-img';if(sl.fit==='contain'){const bg=document.createElement('img');bg.className='bgfill';bg.src=bgOf(sl);bg.alt='';box.appendChild(bg);}const im=document.createElement('img');im.className='main';im.src=sl.img;im.alt='';box.appendChild(im);front.appendChild(box);
  const back=document.createElement('div');back.className='face back';
  const gloss=document.createElement('div');gloss.className='gloss';
  leaf.append(front,back,gloss);wrap.appendChild(leaf);document.body.appendChild(wrap);return{wrap,leaf,shade,gloss};
}
function turnLeaf(L,from,to,dur,forward){
  return new Promise(res=>{
    const t0=performance.now(),ez=t=>t<.5?4*t*t*t:1-Math.pow(-2*t+2,3)/2;
    (function step(now){
      const t=Math.min(1,(now-t0)/dur),a=from+(to-from)*ez(t),k=Math.abs(a)/180;
      L.leaf.style.transform=`perspective(4000px) rotateY(${a}deg)`;
      L.leaf.classList.toggle('show-back',a<-90);
      L.gloss.style.opacity=(Math.sin(k*Math.PI)*.9).toFixed(3);
      L.shade.style.opacity=(1-k).toFixed(3);
      if(t<1)requestAnimationFrame(step);else res();
    })(t0);
  });
}
function makeRnd(sl,extraStyle){

  if(sl.fit==='contain'){const bg=document.createElement('img');bg.className='bgfill';bg.src=bgOf(sl);bg.alt='';box.appendChild(bg);}
  const im=document.createElement('img');im.className='main';im.src=sl.img;im.alt='';box.appendChild(im);r.appendChild(box);return r;
}
function makeContentRnd(){

function bookFlip(frontEl,backEl,baseEl,staticEl,staticSide,from,to){
  const wrap=document.createElement('div');wrap.className='flip-wrap';
  wrap.appendChild(baseEl);
  const half=document.createElement('div');half.className='book-half';half.style.left=staticSide==='left'?'0':'50%';
  staticEl.classList.add('wide');staticEl.style.left=staticSide==='left'?'0':'-100%';half.appendChild(staticEl);wrap.appendChild(half);
  const shadow=document.createElement('div');shadow.className='book-shadow';wrap.appendChild(shadow);
  const leaf=document.createElement('div');leaf.className='book-leaf';
  const fr=document.createElement('div');fr.className='fr';frontEl.classList.add('wide');frontEl.style.left='-100%';fr.appendChild(frontEl);
  const bk=document.createElement('div');bk.className='bkwrap';backEl.classList.add('wide');backEl.style.left='0';bk.appendChild(backEl);
  const gloss=document.createElement('div');gloss.className='book-gloss';
  leaf.append(fr,bk,gloss);wrap.appendChild(leaf);
  const spine=document.createElement('div');spine.className='book-spine';wrap.appendChild(spine);
  leaf.style.transform=`perspective(3200px) rotateY(${from}deg)`;leaf.classList.toggle('show-back',from<-90);
  document.body.appendChild(wrap);
  return decodeAll(wrap).then(()=>new Promise(res=>{
    const dur=1500,t0=performance.now(),ez=t=>t<.5?4*t*t*t:1-Math.pow(-2*t+2,3)/2;
    (function step(now){
      const t=Math.min(1,Math.max(0,(now-t0)/dur)),a=from+(to-from)*ez(t),k=Math.abs(a)/180,lift=Math.sin(k*Math.PI);
      leaf.style.transform=`perspective(3200px) rotateY(${a}deg)`;
      const back=a<-90;leaf.classList.toggle('show-back',back);
      gloss.style.background='linear-gradient(90deg,rgba(0,0,0,.05),rgba(0,0,0,.4))';
      gloss.style.opacity=(lift*.9).toFixed(3);
      spine.style.opacity=(lift*.9).toFixed(3);
      if(!back){shadow.style.left='50%';shadow.style.right='0';shadow.style.background='linear-gradient(90deg,rgba(0,0,0,.45),rgba(0,0,0,0) 70%)';}
      else{shadow.style.left='0';shadow.style.right='50%';shadow.style.background='linear-gradient(270deg,rgba(0,0,0,.45),rgba(0,0,0,0) 70%)';}
      shadow.style.opacity=(lift*.8).toFixed(3);
      if(t<1)requestAnimationFrame(step);else res(wrap);
    })(performance.now());
  }));
}
function renderSlide(dir){
  const i=openIdx;if(i<0)return Promise.resolve();
  const list=SLIDES[i]||[{content:true}];
  const prevIdx=dir>0?slideIdx-1:dir<0?slideIdx+1:-1;
  const oldSl=prevIdx>=0?list[prevIdx]:null,newSl=list[slideIdx];
  if(!dir||reduce||!oldSl){applySlide();return Promise.resolve();}
  if(editing)finishEdit();
  const o1=viewOf(oldSl),o2=viewOf(oldSl);
  applySlide();
  const n1=viewOf(newSl),n2=viewOf(newSl);
  document.body.classList.add('flipping');
  const p=dir>0?bookFlip(o1,n1,n2,o2,'left',0,-180):bookFlip(n1,o1,n2,o2,'right',-180,0);
  return p.then(w=>{requestAnimationFrame(()=>{w.remove();document.body.classList.remove('flipping');});});
}

async function openPage(i){

  const showNow=()=>{page.classList.add('noanim','open');page.setAttribute('aria-hidden','false');document.body.classList.add('page-open');
    requestAnimationFrame(()=>requestAnimationFrame(()=>page.classList.remove('noanim')));};
  if(reduce){showNow();return;}
  const list=SLIDES[i]||[{content:true}];
  const L=leafFrom(viewOf(list[0]));

  document.body.classList.add('flipping');

}
async function flipClosePage(beforeTurn){

  if(editing)finishEdit();

  await turnLeaf(L,0,-180,1300,true);
  L.wrap.remove();document.body.classList.remove('flipping');
  requestAnimationFrame(()=>page.classList.remove('noanim'));
}

  const data={title:pt.textContent.trim().slice(0,200),html:clean(pb.innerHTML)};
  store[i]=data;
  try{localStorage.setItem(LS,JSON.stringify(store));}catch(e){}
  if(db){
    saveState.textContent='Đang lưu...';
    try{await db.doc('chapters/c'+i).set(data);saveState.textContent='Đã lưu.';}
    catch(e){saveState.textContent='Chưa lưu lên được: bạn cần quyền chỉnh sửa artifact này. Bản nháp vẫn giữ trên trình duyệt này.';}
  }else saveState.textContent='Đã lưu trên trình duyệt này.';
}
function queueSave(){if(openIdx<0)return;clearTimeout(saveTimer);const i=openIdx;saveState.textContent='Đang soạn...';saveTimer=setTimeout(()=>persist(i),900);}
function startEdit(){
  if(openIdx<0)return;editing=true;
  pt.contentEditable='true';pb.contentEditable='true';tools.hidden=false;
  editBtn.textContent='Xong';editBtn.classList.add('primary');
  saveState.textContent='Đang chỉnh sửa. Nhấn Xong hoặc Esc để lưu.';
  pb.focus();
}
function finishEdit(){
  if(!editing)return;editing=false;clearTimeout(saveTimer);
  const i=openIdx;
  pt.contentEditable='false';pb.contentEditable='false';tools.hidden=true;
  editBtn.textContent='Chỉnh sửa';editBtn.classList.remove('primary');
  if(i>=0){persist(i);pb.innerHTML=clean(pb.innerHTML);}
}
editBtn.onclick=()=>editing?finishEdit():startEdit();
document.getElementById('backBtn').onclick=done;
[pt,pb].forEach(n=>{
  n.addEventListener('input',queueSave);
  n.addEventListener('paste',e=>{e.preventDefault();const t=(e.clipboardData||window.clipboardData).getData('text/plain');document.execCommand('insertText',false,t);});
});
pt.addEventListener('keydown',e=>{if(e.key==='Enter'){e.preventDefault();pb.focus();}});
tools.querySelectorAll('button').forEach(b=>{
  b.addEventListener('mousedown',e=>e.preventDefault());
  b.addEventListener('click',()=>{
    const c=b.dataset.cmd;pb.focus();
    if(c==='h3')document.execCommand('formatBlock',false,'h3');
    else if(c==='p')document.execCommand('formatBlock',false,'p');
    else if(c==='quote')document.execCommand('formatBlock',false,'blockquote');
    else document.execCommand(c,false,null);
    queueSave();
  });
});
editBtn.hidden=false;
slideNextBtn.addEventListener('click',()=>next());
document.getElementById('flipNext').addEventListener('click',e=>{e.stopPropagation();next();});
document.getElementById('slideImg').addEventListener('click',()=>{
  const sl=openIdx>=0&&SLIDES[openIdx]?SLIDES[openIdx][slideIdx]:null;
  const v=document.getElementById('slideVidEl');
  if(sl&&sl.video&&sl.audio&&!v.hidden){if(v.paused){v.play().catch(()=>{});}else{v.pause();}return;}
  next();
});

(async()=>{
  if(!window.claude||!window.claude.use)return;
  try{
    const user=await window.claude.use('user');
    if(user){try{canEdit=await user.canEdit();}catch(e){}}
    editBtn.hidden=!canEdit;
    if(openIdx>=0&&!editing)renderPage(openIdx);
  }catch(e){}
  try{
    db=await window.claude.use('db');
    if(db){
      db.collection('chapters').onSnapshot(snap=>{
        snap.docs.forEach(d=>{
          const m=/^c(\d)$/.exec(d.id);if(!m||!d.exists)return;
          const v=d.data()||{};store[+m[1]]={title:String(v.title||''),html:String(v.html||'')};
        });
        if(openIdx>=0&&!editing&&!page.classList.contains('img-mode'))renderPage(openIdx);
      },()=>{});
    }
  }catch(e){db=null;}
})();

ship.addEventListener('click',()=>next());
ship.setAttribute('role','button');ship.setAttribute('aria-label','Đi tới đảo tiếp theo hoặc mở đảo đang đậu');


/* ---------- intro ---------- */
const intro=document.getElementById('intro');
let introState=0;
let introPos={ox:0,oy:0,s0:.42},introPopped=false;
function poppedPose(){const {ox,oy,s0}=introPos;return `translate(${ox}px,${oy-26}px) rotate(-14deg) perspective(1600px) rotateX(12deg) scale(${s0})`;}
function popOut(){
  if(introPopped||introState)return;introPopped=true;
  const sc=document.getElementById('scroll'),{ox,oy}=introPos;
  sc.style.transition='none';sc.style.opacity='0';sc.style.transform=`translate(${ox}px,${oy}px) rotate(-30deg) scale(.04)`;
  void sc.offsetWidth;
  sc.style.transition='transform .6s cubic-bezier(.2,1.5,.4,1),opacity .25s ease';
  sc.style.opacity='1';sc.style.transform=poppedPose();
}
function placeIntro(){
  const W=innerWidth,H=innerHeight,portrait=H>W*1.1;
  /* the mascot holds a map in the lower-right of the cover: the scroll comes out of its hands */
  const tx=portrait?W*.5:W*.885,ty=portrait?H*.86:H*.875;
  const sc=document.getElementById('scroll');if(!sc)return;
  const h=sc.offsetHeight||1;
  const s0=Math.min(.4,(portrait?H*.16:H*.2)/(h*1.12));
  introPos={ox:tx-W/2,oy:ty-H/2,s0};
  const hint=document.getElementById('introHint');
  if(hint){
    if(portrait){hint.style.left='50%';hint.style.right='auto';hint.style.top=(H*.7)+'px';hint.style.transform='translate(-50%,-50%)';}
    else{hint.style.left='auto';hint.style.right=(W-W*.815)+'px';hint.style.top=(H*.62)+'px';hint.style.transform='';}
  }
  if(introState===0){sc.style.transition='none';
    if(introPopped){sc.style.opacity='1';sc.style.transform=poppedPose();}
    else{sc.style.opacity='0';sc.style.transform=`translate(${introPos.ox}px,${introPos.oy}px) scale(.04)`;}}
}
function setUnroll(p){
  const e=.5-.5*Math.cos(Math.PI*p), sc=document.getElementById('scroll');
  const L=50*(1-e),R=50+50*e,w=8.5-4.1*e;
  sc.querySelector('.paper').style.clipPath=`inset(0 ${L}% 0 ${L}%)`;
  const rl=sc.querySelector('.roll.l'),rr=sc.querySelector('.roll.r');
  rl.style.left=L+'%';rr.style.left=R+'%';rl.style.width=rr.style.width=w+'%';
  sc.querySelector('.curl.l').style.left=L+'%';sc.querySelector('.curl.r').style.left=R+'%';
  const m=Math.min(1,e*1.25),{ox,oy,s0}=introPos;
  sc.style.transform=`translate(${ox*(1-m)}px,${oy*(1-m)}px) rotate(${-14*(1-m)}deg) perspective(1600px) rotateX(${12*(1-e)}deg) scale(${s0+(1-s0)*m})`;
}
function unroll(sec){
  return new Promise(res=>{
    if(reduce){setUnroll(1);res();return;}
    const t0=performance.now();
    (function step(now){const p=Math.min(1,(now-t0)/1000/sec);setUnroll(p);if(p<1)requestAnimationFrame(step);else res();})(t0);
  });
}
async function openIntro(){
  if(introState)return;introState=1;
  try{if(!document.fullscreenElement&&document.documentElement.requestFullscreen)document.documentElement.requestFullscreen().catch(()=>{});}catch(e){}
  const sc=document.getElementById('scroll');
  intro.classList.add('opening');
  if(!introPopped){introPopped=true;const {ox,oy}=introPos;
   sc.style.transition='none';sc.style.opacity='0';sc.style.transform=`translate(${ox}px,${oy}px) rotate(-30deg) scale(.04)`;
   void sc.offsetWidth;
   sc.style.transition='transform .55s cubic-bezier(.2,1.5,.4,1),opacity .25s ease';
   sc.style.opacity='1';sc.style.transform=poppedPose();
   await wait(600);}
  else await wait(350);
  sc.style.transition='none';setUnroll(0);
  intro.classList.add('open');
  await unroll(1.5);
  const r=sc.getBoundingClientRect(),c=camOverview(),k=c.s*1600/r.width;
  const rcx=r.left+r.width/2,rcy=r.top+r.height/2;
  const dx=c.x-rcx-(r.left-rcx)*k,dy=c.y-rcy-(r.top-rcy)*k;
  sc.style.transition='transform 1s cubic-bezier(.5,0,.25,1)';
  sc.style.transform=`translate(${dx}px,${dy}px) scale(${k})`;
  intro.classList.add('expand');await wait(reduce?20:1000);
  intro.style.transition='opacity .45s ease';intro.classList.add('gone');await wait(reduce?20:500);
  intro.remove();introState=2;
}
intro.addEventListener('click',openIntro);
placeIntro();setTimeout(popOut,900);addEventListener('resize',()=>{if(introState<2)placeIntro();});
if(document.fonts&&document.fonts.ready)document.fonts.ready.then(()=>{if(introState===0)placeIntro();});

/* HUD: ship's helm */
const helm=document.getElementById('helm'),wheel=document.getElementById('wheel'),HC={x:140,y:160};
const TOK_A=ISL.map((_,i)=>-162+i*(144/(N-1)));
(function(){
  const sp=document.getElementById('spokes');
  for(let k=0;k<8;k++){const a=(k*45-90)*Math.PI/180,c=Math.cos(a),sn=Math.sin(a);
    el('line',{x1:HC.x+c*20,y1:HC.y+sn*20,x2:HC.x+c*86,y2:HC.y+sn*86,stroke:'#5a3514','stroke-width':9,'stroke-linecap':'round'},sp);
    el('line',{x1:HC.x+c*20,y1:HC.y+sn*20,x2:HC.x+c*86,y2:HC.y+sn*86,stroke:'#a8693a','stroke-width':5.5,'stroke-linecap':'round'},sp);
    el('line',{x1:HC.x+c*80,y1:HC.y+sn*80,x2:HC.x+c*100,y2:HC.y+sn*100,stroke:'#5a3514','stroke-width':15,'stroke-linecap':'round'},sp);
    el('line',{x1:HC.x+c*80,y1:HC.y+sn*80,x2:HC.x+c*100,y2:HC.y+sn*100,stroke:k===0?'#e8b23a':'#b8763f','stroke-width':10,'stroke-linecap':'round'},sp);
    el('line',{x1:HC.x+c*83-sn*2,y1:HC.y+sn*83+c*2,x2:HC.x+c*97-sn*2,y2:HC.y+sn*97+c*2,stroke:'#fff','stroke-opacity':.35,'stroke-width':2,'stroke-linecap':'round'},sp);
  }
  const tg=document.getElementById('tokens');
  TOK_A.forEach((deg,i)=>{const a=deg*Math.PI/180,x=HC.x+Math.cos(a)*128,y=HC.y+Math.sin(a)*128;
    const g=el('g',{class:'tok',role:'button',tabindex:0,'aria-label':`Chặng ${i+1}: ${ISL[i].name}`},tg);
    el('title',{},g).textContent=ISL[i].name;
    el('circle',{cx:x,cy:y,r:19},g);const t=el('text',{x,y:y+7,'text-anchor':'middle'},g);t.textContent=i+1;
    g.addEventListener('click',e=>{e.stopPropagation();jump(i);});
    g.addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();e.stopPropagation();jump(i);}});
  });
})();
let wheelBase=0,wheelExtra=0;
function setWheel(){wheel.style.transform=`rotate(${wheelBase+wheelExtra}deg)`;}
function aimWheel(){const target=(cur>=0?TOK_A[cur]:-90)+90;wheelBase=target;setWheel();}
function nudge(dir){wheelExtra=dir*28;setWheel();setTimeout(()=>{wheelExtra=0;setWheel();},260);}
function helmNext(){nudge(1);next();}
function helmPrev(){nudge(-1);prev();}
const hub=document.getElementById('hub');
hub.addEventListener('click',e=>{e.stopPropagation();toMap();});
hub.addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();e.stopPropagation();toMap();}});
/* drag to steer */
function helmPt(e){const r=helm.getBoundingClientRect(),k=r.width/280;return{x:(e.clientX-r.left)/k,y:(e.clientY-r.top)/k};}
let drag=null;
wheel.addEventListener('pointerdown',e=>{const p=helmPt(e);drag={a0:Math.atan2(p.y-HC.y,p.x-HC.x),d:0,x:p.x,moved:false};wheel.classList.add('drag');wheel.setPointerCapture(e.pointerId);});
wheel.addEventListener('pointermove',e=>{if(!drag)return;const p=helmPt(e);let a=Math.atan2(p.y-HC.y,p.x-HC.x),d=(a-drag.a0)*180/Math.PI;
  if(d>180)d-=360;if(d<-180)d+=360;drag.d=d;if(Math.abs(d)>4)drag.moved=true;wheelExtra=d;setWheel();});
function endDrag(){if(!drag)return;const d=drag.d,moved=drag.moved,x=drag.x;drag=null;wheel.classList.remove('drag');wheelExtra=0;setWheel();
  if(moved){if(d>25)next();else if(d<-25)prev();}
  else{x<HC.x?helmPrev():helmNext();}}
wheel.addEventListener('pointerup',endDrag);wheel.addEventListener('pointercancel',endDrag);
let wheelT=0;
helm.addEventListener('wheel',e=>{e.preventDefault();const now=Date.now();if(now-wheelT<900)return;wheelT=now;(e.deltaY>0||e.deltaX>0)?helmNext():helmPrev();},{passive:false});
function fs(){try{document.fullscreenElement?document.exitFullscreen():document.documentElement.requestFullscreen();}catch(e){}}
document.getElementById('fsBtn').onclick=fs;

addEventListener('keydown',e=>{
  if(introState<2){if(['ArrowRight','ArrowDown','PageDown',' ','Enter'].includes(e.key)){e.preventDefault();openIntro();}return;}
  if(editing){if(e.key==='Escape'){e.preventDefault();finishEdit();}return;}
  if(e.target.closest&&e.target.closest('button,.isl')&&(e.key===' '||e.key==='Enter'))return;
  const k=e.key;
  if(k===' '){const sl=openIdx>=0&&SLIDES[openIdx]?SLIDES[openIdx][slideIdx]:null;const v=document.getElementById('slideVidEl');
    if(sl&&sl.video&&sl.audio&&!v.hidden&&zoomed){e.preventDefault();v.paused?v.play().catch(()=>{}):v.pause();return;}}
  if(['ArrowRight','ArrowDown','PageDown',' '].includes(k)){e.preventDefault();next();}
  else if(['ArrowLeft','ArrowUp','PageUp','Backspace'].includes(k)){e.preventDefault();prev();}
  else if(k==='Escape'||k==='m'||k==='M'){toMap();}
  else if(k==='p'||k==='P'){e.preventDefault();openHere();}
  else if(k==='f'||k==='F'){fs();}
});

let rt;
addEventListener('resize',()=>{
  world.classList.add('instant');
  applyCam(zoomed&&cur>=0?camIsland(cur):camOverview());
  clearTimeout(rt);rt=setTimeout(()=>world.classList.remove('instant'),60);
});

setShip(HARBOR.x,HARBOR.y,1);
world.classList.add('instant');applyCam(camOverview());
requestAnimationFrame(()=>requestAnimationFrame(()=>world.classList.remove('instant')));
updateDots();
})();
</script>
